<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes achats - Achetons Burkinabe</title>
  <meta name="description" content="Historique de vos commandes sur Achetons Burkinabè : suivez le statut de vos achats, téléchargez vos reçus et laissez des avis sur les produits.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/icons.css">
  
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/historique.css">
  <link rel="icon" type="image/svg+xml" href="images/logo/favicon.svg">
</head>
<body>
  <a href="#main" class="skip-link">Aller au contenu</a>

  <main id="main">
    <div class="container">
      <header class="page-header">
        <p class="eyebrow">Mon activité</p>
        <h1>Mes achats</h1>
        <p class="text-doux">Suivez vos commandes, téléchargez vos reçus, contactez les vendeurs.</p>
      </header>

      <div class="filter-tabs" id="history-filters">
        <button class="filter-chip active" data-status="tous">Tous</button>
        <button class="filter-chip" data-status="en_cours">En cours</button>
        <button class="filter-chip" data-status="acceptee">Acceptées</button>
        <button class="filter-chip" data-status="livree">Livrées</button>
        <button class="filter-chip" data-status="recu">Reçues</button>
        <button class="filter-chip" data-status="refusee">Refusées</button>
      </div>

      <div id="history-container">
        <div class="spinner" style="margin: 80px auto;"></div>
      </div>
    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/embedded-data.js"></script>
  <script src="js/data-seed.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui-components.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/app.js"></script>
  <script>
    let activeStatus = 'tous';

    document.addEventListener('app:ready', () => {
      const session = Auth.requireAuth(['acheteur', 'revendeur']);
      if (!session) return;

      document.getElementById('history-filters').addEventListener('click', (e) => {
        const chip = e.target.closest('.filter-chip');
        if (!chip) return;
        activeStatus = chip.dataset.status;
        document.querySelectorAll('#history-filters .filter-chip').forEach(c => c.classList.toggle('active', c === chip));
        renderHistory(session);
      });

      renderHistory(session);
    });

    function renderHistory(session) {
      const container = document.getElementById('history-container');
      let orders = Storage.getOrders(session.user_id);

      if (activeStatus !== 'tous') {
        orders = orders.filter(o => o.status === activeStatus);
      }

      if (!orders.length) {
        container.innerHTML = `
          <div class="empty-state card">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            <h3>Aucune commande</h3>
            <p>Vous n'avez pas encore passé de commande${activeStatus !== 'tous' ? ' dans cette catégorie' : ''}.</p>
            <a href="produits.html" class="btn btn-primary">Voir les produits</a>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="orders-list">
          ${orders.map(o => `
            <div class="card history-card">
              <div class="history-card-header">
                <div>
                  <strong>${o.order_id}</strong>
                  <span class="text-caption">${Utils.formatDate(o.order_date)}</span>
                </div>
                <span class="badge ${Checkout.statusBadgeClass(o.status)}">${Checkout.statusLabel(o.status)}</span>
              </div>
              <div class="history-card-items">
                ${o.items.slice(0, 3).map(it => `
                  <div class="history-item-mini">
                    <span>${Utils.escapeHtml(it.nom)} ×${it.quantity}</span>
                    <span class="text-caption">${Utils.formatPrice(it.line_total)}</span>
                  </div>
                `).join('')}
                ${o.items.length > 3 ? `<p class="text-caption">+ ${o.items.length - 3} autre(s) produit(s)</p>` : ''}
              </div>
              <div class="history-card-footer">
                <div>
                  <span class="text-caption">Total</span>
                  <strong class="price">${Utils.formatPrice(o.total)}</strong>
                </div>
                <div class="history-card-actions">
                  <button class="btn btn-ghost btn-sm view-receipt-btn" data-order-id="${o.order_id}">Voir le reçu</button>
                  ${o.seller_ids.length === 1 ? `
                    <a href="contact-vendeur.html?seller_id=${o.seller_ids[0]}" class="btn btn-secondary btn-sm">Contacter vendeur</a>
                  ` : `
                    <a href="notifications.html" class="btn btn-secondary btn-sm">Messages</a>
                  `}
                  ${o.status === 'livree' ? `
                    <button class="btn btn-success btn-sm mark-received-btn" data-order-id="${o.order_id}">Marquer reçue</button>
                  ` : ''}
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      container.querySelectorAll('.view-receipt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const orderId = btn.dataset.orderId;
          const order = Storage.getOrders(session.user_id).find(o => o.order_id === orderId);
          if (!order) return;
          UI.modal({
            title: 'Reçu ' + order.order_id,
            body: Checkout.renderReceiptHTML(order),
            actions: [
              { text: 'Imprimer', style: 'btn-primary', onClick: () => window.print() },
              { text: 'Fermer', style: 'btn-ghost', close: true }
            ]
          });
        });
      });

      container.querySelectorAll('.mark-received-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const orderId = btn.dataset.orderId;
          UI.confirm('Confirmer la réception de cette commande ?', () => {
            Storage.updateOrder(session.user_id, orderId, { status: 'recu' });
            Storage.addActivity(session.user_id, {
              type: 'commande_recue',
              detail: 'Commande ' + orderId + ' marquee comme recue'
            });
            // Notifie les vendeurs (type 'order_delivered' = fin de cycle de livraison)
            const order = Storage.getOrders(session.user_id).find(o => o.order_id === orderId);
            if (order) {
              order.seller_ids.forEach(sid => {
                Storage.addNotification(sid, {
                  type: 'order_delivered',
                  title: 'Commande confirmee par l\'acheteur',
                  message: `L'acheteur a confirme la reception de ${orderId}. Vente finalisee.`,
                  link: 'dashboard-vendeur.html',
                  order_id: orderId
                });
                try {
                  Storage.addActivity(sid, {
                    type: 'vente_confirmee',
                    detail: 'Commande ' + orderId + ' confirmee par l\'acheteur (vente finalisee)'
                  });
                } catch (e) {}
              });
            }
            UI.updateNotifBadge();
            UI.toast('Commande marquée comme reçue. Merci !', 'success');
            renderHistory(session);
          }, { confirmText: 'Confirmer la réception' });
        });
      });
    }
  </script>
</body>
</html>
