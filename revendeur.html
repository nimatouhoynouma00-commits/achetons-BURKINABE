<!DOCTYPE html>
<html lang="fr">
<head>

<link rel="stylesheet" href="css/style.css">

<script>
document.addEventListener('app:ready', () => {
    // Pour la demo on autorise aussi les acheteurs curieux, mais on recommande connexion revendeur

    const session = Auth.requireAuth();
    if (!session) return;

    const container = document.getElementById('reseller-container');
    Reseller.renderPage(container);
});
</script>
